<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A little less noise. A lot more possibility. Get early access to the Project."
    />
    <meta name="theme-color" content="#f8f7fc" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Coming Soon</title>

    <script>
      (function () {
        var preference = "system";

        try {
          var saved = localStorage.getItem("luma-theme");

          if (saved === "light" || saved === "dark" || saved === "system") {
            preference = saved;
          }
        } catch (_) {
          // Storage can be unavailable in restricted browsing contexts.
        }

        var prefersDark = window.matchMedia
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : false;

        var dark =
          preference === "dark" ||
          (preference === "system" && prefersDark);

        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";

        var themeColor = document.querySelector('meta[name="theme-color"]');

        if (themeColor) {
          themeColor.setAttribute("content", dark ? "#101017" : "#f8f7fc");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
